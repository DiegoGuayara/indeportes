services:
  mysql:
    image: mysql:8.0
    container_name: document-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: document_service
      MYSQL_USER: document_user
      MYSQL_PASSWORD: document_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: